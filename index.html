<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Siddiq Spin Wheel</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: linear-gradient(135deg, #090d16, #121826, #090d16);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .header-container {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 { 
      margin: 0 0 10px 0;
      font-size: 38px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff007f, #7928ca, #00dfd8, #ff007f);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rgbText 6s linear infinite;
      text-shadow: 0 0 30px rgba(121, 40, 202, 0.5);
    }

    @keyframes rgbText {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    .creator-badge {
      display: inline-block;
      padding: 6px 20px;
      background: rgba(255, 0, 127, 0.15);
      border: 2px solid #ff007f;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 800;
      color: #ff77b9;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
    }

    .input-section {
      width: 100%;
      max-width: 480px;
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .input-label {
      font-size: 15px;
      font-weight: 700;
      color: #00dfd8;
      text-shadow: 0 0 10px rgba(0, 223, 216, 0.4);
    }

    textarea {
      width: 100%;
      height: 100px;
      background: rgba(18, 24, 38, 0.9);
      border: 2px solid rgba(0, 223, 216, 0.4);
      border-radius: 10px;
      color: #ffffff;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }

    textarea:focus {
      border-color: #ff007f;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
    }

    .btn-update {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: linear-gradient(45deg, #007cf0, #00dfd8);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(0, 223, 216, 0.4);
      transition: all 0.2s ease;
    }

    .btn-update:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 223, 216, 0.7);
    }

    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 950px;
    }

    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-container {
      position: relative;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background-color: #0f172a;
      box-shadow: 0 0 20px #ff007f, 0 0 40px #7928ca, 0 0 60px #00dfd8;
      animation: rgbGlow 4s infinite alternate;
    }

    @keyframes rgbGlow {
      0% { box-shadow: 0 0 15px #ff007f, 0 0 30px #7928ca; }
      50% { box-shadow: 0 0 20px #7928ca, 0 0 40px #00dfd8; }
      100% { box-shadow: 0 0 15px #00dfd8, 0 0 30px #ff007f; }
    }

    .pointer {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 36px solid #ff007f;
      z-index: 10;
      filter: drop-shadow(0 0 8px #ff007f);
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background-color: #121826;
      border-radius: 50%;
      border: 4px solid #00dfd8;
      z-index: 5;
      box-shadow: 0 0 15px #00dfd8;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      justify-content: center;
      width: 100%;
    }

    button {
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #spin-btn {
      background: linear-gradient(45deg, #7928ca, #ff007f);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    #spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
    }

    #skip-btn {
      background: linear-gradient(45deg, #007cf0, #00dfd8);
      box-shadow: 0 0 15px rgba(0, 223, 216, 0.4);
    }

    #skip-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 223, 216, 0.7);
    }

    button:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #winner-text {
      margin-top: 18px;
      font-size: 24px;
      font-weight: 800;
      color: #00dfd8;
      text-shadow: 0 0 15px rgba(0, 223, 216, 0.6);
      min-height: 35px;
      text-align: center;
    }

    .table-section {
      background: rgba(18, 24, 38, 0.85);
      border: 2px solid rgba(0, 223, 216, 0.3);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      width: 260px;
      max-height: 420px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      color: #00dfd8;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(15, 23, 42, 0.9);
      position: sticky;
      top: 0;
    }

    td {
      color: #cbd5e1;
    }

    .highlight-winner {
      background: linear-gradient(90deg, rgba(121, 40, 202, 0.4), rgba(255, 0, 127, 0.4)) !important;
      color: #ffffff;
      font-weight: bold;
      border-left: 4px solid #ff007f;
      text-shadow: 0 0 8px #ff007f;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Siddiq Spin Wheel</h1>
    <div class="creator-badge">Created by Siddiq</div>
  </div>

  <div class="input-section">
    <label class="input-label" for="name-input">Enter Names (One name per line):</label>
    <textarea id="name-input" placeholder="Type or paste names here...&#10;Example:&#10;Alex&#10;Jordan&#10;Taylor"></textarea>
    <button class="btn-update" id="update-btn">Update Wheel</button>
  </div>
  
  <div class="main-layout">
    <div class="wheel-section">
      <div class="wheel-container">
        <div class="pointer"></div>
        <div class="center-circle"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
      </div>

      <div class="button-group">
        <button id="spin-btn" disabled>Spin</button>
        <button id="skip-btn" disabled>Skip</button>
      </div>
      
      <div id="winner-text">Please enter names to start</div>
    </div>

    <div class="table-section">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Participant Name</th>
          </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spin-btn");
    const skipBtn = document.getElementById("skip-btn");
    const updateBtn = document.getElementById("update-btn");
    const nameInput = document.getElementById("name-input");
    const winnerText = document.getElementById("winner-text");
    const tableBody = document.getElementById("table-body");

    let names = [];
    const colors = [
      "#2563eb", "#059669", "#db2777", "#7c3aed", "#d97706",
      "#0284c7", "#16a34a", "#dc2626", "#9333ea", "#ca8a04",
      "#0d9488", "#4f46e5", "#ea580c", "#c026d3", "#0891b2"
    ];

    let currentRotation = 0;
    let isSpinning = false;
    let spinTimeout = null;
    let tickInterval = null;

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(500, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playWinSound() {
      if (!audioCtx) return;
      const freqs = [523.25, 659.25, 783.99];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.start(audioCtx.currentTime + (i * 0.08));
        osc.stop(audioCtx.currentTime + 1.2);
      });
    }

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (names.length === 0) {
        ctx.beginPath();
        ctx.fillStyle = "#1e293b";
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.fill();
        ctx.textAlign = "center";
        ctx.fillStyle = "#64748b";
        ctx.font = "bold 32px 'Segoe UI', Arial";
        ctx.fillText("No Names Added", centerX, centerY + 10);
        return;
      }

      const arc = (2 * Math.PI) / names.length;

      for (let i = 0; i < names.length; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arc);
        ctx.lineTo(centerX, centerY);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#0f172a";
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
        ctx.shadowBlur = 5;
        
        let fontSize = 30;
        if (names.length > 20) fontSize = 20;
        else if (names.length > 12) fontSize = 24;

        ctx.font = `bold ${fontSize}px 'Segoe UI', Arial`; 
        ctx.fillText(names[i], radius - 35, 8);
        ctx.restore();
      }
    }

    function buildTable() {
      tableBody.innerHTML = "";
      names.forEach((name, index) => {
        const tr = document.createElement("tr");
        tr.id = `row-${index}`;
        tr.innerHTML = `<td>${index + 1}</td><td>${name}</td>`;
        tableBody.appendChild(tr);
      });
    }

    function updateNamesFromInput() {
      const rawText = nameInput.value;
      names = rawText.split("\n").map(n => n.trim()).filter(n => n !== "");

      if (names.length < 2) {
        winnerText.innerText = "Add at least 2 names to spin";
        spinBtn.disabled = true;
      } else {
        winnerText.innerText = "Ready to spin!";
        spinBtn.disabled = false;
      }

      drawWheel();
      buildTable();
    }

    function showWinner(finalRot) {
      if (names.length === 0) return;

      const normalizedRotation = finalRot % 360;
      const degreePerSegment = 360 / names.length;
      let pointerAngle = (270 - normalizedRotation) % 360;
      if (pointerAngle < 0) pointerAngle += 360;
      const winningIndex = Math.floor(pointerAngle / degreePerSegment);
      
      winnerText.innerText = "Winner: " + names[winningIndex];
      playWinSound();
      
      confetti({ 
        particleCount: 120, 
        spread: 80, 
        origin: { y: 0.6 }, 
        colors: ['#ff007f', '#7928ca', '#00dfd8', '#ffaa00']
      });

      const rows = document.querySelectorAll("#table-body tr");
      rows.forEach(row => row.classList.remove("highlight-winner"));
      if (document.getElementById(`row-${winningIndex}`)) {
        document.getElementById(`row-${winningIndex}`).classList.add("highlight-winner");
      }

      spinBtn.disabled = false;
      skipBtn.disabled = true;
      isSpinning = false;
    }

    updateBtn.addEventListener("click", updateNamesFromInput);

    spinBtn.addEventListener("click", () => {
      if (isSpinning || names.length < 2) return;
      isSpinning = true;
      initAudio();
      
      spinBtn.disabled = true;
      skipBtn.disabled = false;
      winnerText.innerText = "Spinning...";
      
      document.querySelectorAll("#table-body tr").forEach(row => row.classList.remove("highlight-winner"));

      const randomSpins = Math.floor(Math.random() * 4) + 5; 
      const randomDegree = Math.floor(Math.random() * 360);
      const targetRotationValue = currentRotation + (randomSpins * 360) + randomDegree;
      currentRotation = targetRotationValue;

      canvas.style.transition = 'transform 5s cubic-bezier(0.15, 0.75, 0.1, 1)';
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      let ticks = 0;
      tickInterval = setInterval(() => {
        playTick();
        ticks++;
        if(ticks > 40) clearInterval(tickInterval); 
      }, 110);

      spinTimeout = setTimeout(() => {
        clearInterval(tickInterval);
        showWinner(currentRotation);
      }, 5000); 
    });

    skipBtn.addEventListener("click", () => {
      if (!isSpinning) return;
      
      clearTimeout(spinTimeout);
      clearInterval(tickInterval);

      canvas.style.transition = 'none';
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      showWinner(currentRotation);
    });

    drawWheel();
  </script>
</body>
</html>
